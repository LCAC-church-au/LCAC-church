backend:
  name: github
  repo: LCAC-church-au/LCAC-church
  branch: main

publish_mode: editorial_workflow

media_folder: "images"
public_folder: "/images"

collections:
  - name: "sermons"
    label: "أرشيف العظات"
    folder: "_sermons"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "لغة العظة", name: "language", widget: "select", options: [{label: "العربية", value: "ar"}, {label: "English", value: "en"}], default: "ar"}
      - {label: "عنوان العظة", name: "title", widget: "string"}
      - {label: "اسم الواعظ", name: "speaker", widget: "string"}
      - {label: "التاريخ", name: "date", widget: "string", hint: "31-08-2026"}
      - {label: "رابط يوتيوب (Embed ID)", name: "youtube_id", widget: "string"}
      - {label: "ملخص العظة", name: "summary", widget: "text"}

  - name: "conference_page"
    label: "صفحة مؤتمر مجد الرب"
    folder: "_pages"
    create: false
    identifier_field: "title"
    files:
      - file: "conference.html"
        label: "تعديل محتوى المؤتمر"
        name: "conference"
        fields:
          - {label: "عنوان المؤتمر الرئيسي", name: "title", widget: "string"}
          - {label: "آية المؤتمر / الشعار", name: "verse", widget: "text"}

  - name: "home_page"
    label: "الصفحة الرئيسية (ar.html)"
    files:
      - file: "ar.html"
        label: "تعديل الصفحة الرئيسية"
        name: "home"
        fields:
          - {label: "عنوان الترحيب", name: "welcome_title", widget: "string"}
          - {label: "نص الرؤية والخدمات", name: "vision", widget: "text"}
