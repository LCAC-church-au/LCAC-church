backend:
  name: github
  repo: LCAC-church-au/LCAC-church
  branch: main

publish_mode: editorial_workflow

media_folder: "images"
public_folder: "/images"

collections:
  - name: "sermons"
    label: "أرشيف العظات / Sermons Archive"
    folder: "_sermons"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "لغة العظة / Language", name: "language", widget: "select", options: [{label: "العربية", value: "ar"}, {label: "English", value: "en"}], default: "ar"}
      - {label: "عنوان العظة", name: "title", widget: "string"}
      - {label: "اسم الواعظ", name: "speaker", widget: "string"}
      - {label: "التاريخ", name: "date", widget: "string", hint: "31-08-2026"}
      - {label: "رابط يوتيوب (Embed ID)", name: "youtube_id", widget: "string"}
      - {label: "ملخص العظة", name: "summary", widget: "text"}

  - name: "pages"
    label: "صفحات الموقع / Site Pages"
    files:
      - file: "conference.html"
        label: "صفحة مؤتمر مجد الرب"
        name: "conference"
        fields:
          - {label: "لغة الصفحة", name: "language", widget: "select", options: [{label: "العربية", value: "ar"}, {label: "English", value: "en"}], default: "ar"}
          - {label: "عنوان المؤتمر الرئيسي", name: "title", widget: "string"}
          - {label: "آية المؤتمر / الشعار", name: "verse", widget: "text"}
          - {label: "تفاصيل وجدول المؤتمر", name: "content", widget: "markdown"}

      - file: "ar.html"
        label: "الصفحة الرئيسية (العربية)"
        name: "home_ar"
        fields:
          - {label: "لغة الصفحة", name: "language", widget: "select", options: [{label: "العربية", value: "ar"}, {label: "English", value: "en"}], default: "ar"}
          - {label: "عنوان الترحيب الرئيسي", name: "welcome_title", widget: "string"}
          - {label: "نص الرؤية والخدمات", name: "vision", widget: "text"}
