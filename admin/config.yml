backend:
  name: github
  repo: LCAC-church-au/LCAC-church
  branch: main
  base_url: https://lifecenterarabicchurch.org
  auth_endpoint: auth

publish_mode: editorial_workflow

media_folder: "images"
public_folder: "/images"

collections:
  - name: "sermons"
    label: "أرشيف العظات"
    folder: "_sermons"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "لغة العظة", name: "language", widget: "select", options: [{label: "العربية", value: "ar"}, {label: "English", value: "en"}], default: "ar"}
      - {label: "عنوان العظة", name: "title", widget: "string"}
      - {label: "اسم الواعظ", name: "speaker", widget: "string"}
      - {label: "التاريخ", name: "date", widget: "string", hint: "31-08-2026"}
      - {label: "رابط يوتيوب (Embed ID)", name: "youtube_id", widget: "string"}
      - {label: "ملخص العظة", name: "summary", widget: "text"}

  - name: "conferences"
    label: "المؤتمرات والفعاليات"
    folder: "_conferences"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "لغة المؤتمر", name: "language", widget: "select", options: [{label: "العربية", value: "ar"}, {label: "English", value: "en"}], default: "ar"}
      - {label: "عنوان المؤتمر", name: "title", widget: "string"}
      - {label: "آية المؤتمر / الشعار", name: "verse", widget: "text"}
      - {label: "تاريخ المؤتمر", name: "date", widget: "string"}
      - {label: "تفاصيل وجدول المؤتمر", name: "body", widget: "markdown"}

  - name: "services"
    label: "خدمات الكنيسة"
    folder: "_services"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "عنوان الخدمة", name: "title", widget: "string"}
      - {label: "وصف الخدمة", name: "description", widget: "text"}
      - {label: "صورة الخدمة", name: "image", widget: "image", required: false}

  - name: "site_settings"
    label: "إعدادات الموقع والتواصل"
    folder: "_settings"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "اسم الصفحة أو القسم", name: "title", widget: "string"}
      - {label: "أرقام الهواتف والعنوان", name: "contact_info", widget: "text"}
      - {label: "معلومات التواصل", name: "body", widget: "markdown"}
