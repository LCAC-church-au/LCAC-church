backend:
  name: github
  repo: LCAC-church-au/LCAC-church
  branch: main

publish_mode: editorial_workflow

media_folder: "images"
public_folder: "/images"

collections:
  - name: "sermons"
    label: "أرشيف العظات"
    folder: "_sermons"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "لغة العظة", name: "language", widget: "select", options: [{label: "العربية", value: "ar"}, {label: "English", value: "en"}], default: "ar"}
      - {label: "عنوان العظة", name: "title", widget: "string"}
      - {label: "اسم الواعظ", name: "speaker", widget: "string"}
      - {label: "التاريخ", name: "date", widget: "string", hint: "31-08-2026"}
      - {label: "رابط يوتيوب (Embed ID)", name: "youtube_id", widget: "string"}
      - {label: "ملخص العظة", name: "summary", widget: "text"}

  - name: "pages"
    label: "إدارة صفحات الموقع"
    folder: "_pages"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "اسم الصفحة (مثل: ar أو conference)", name: "title", widget: "string"}
      - {label: "محتوى الصفحة", name: "body", widget: "markdown"}
