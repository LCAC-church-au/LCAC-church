<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">          
    <title>Life Center Arabic Church - LCAC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Cairo', sans-serif; color: #ffffff; background: transparent !important; }

        /* صور الخلفية المتحركة */
        .en-bg-slideshow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; overflow: hidden; }
        .en-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; animation: enSlideAnimation 30s infinite; }
        .en-slide:nth-child(1) { background-image: url('church4.jpg'); animation-delay: 0s; }
        .en-slide:nth-child(2) { background-image: url('church5.jpg'); animation-delay: 6s; }
        .en-slide:nth-child(3) { background-image: url('church6.jpg'); animation-delay: 12s; }
        .en-slide:nth-child(4) { background-image: url('church7.jpg'); animation-delay: 18s; }
        .en-slide:nth-child(5) { background-image: url('church8.jpg'); animation-delay: 24s; }
        @keyframes enSlideAnimation { 0% { opacity: 0; transform: scale(1); } 8% { opacity: 1; } 24% { opacity: 1; } 32% { opacity: 0; transform: scale(1.05); } 100% { opacity: 0; } }
        
        /* طبقة تعتيم خفيفة جداً وموحدة لتظهر الصور بوضوح */
        .en-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: -1; }

        /* الهيدر وقائمة التنقل (شفافة تماماً) */
        header {
            background: rgba(11, 11, 11, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 15px 30px;
            direction: ltr;
        }
        .logo a { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            text-decoration: none; 
            color: #ffffff !important; 
            font-weight: bold; 
            font-size: 1rem; 
            text-shadow: 0 2px 6px rgba(0,0,0,0.8); 
        }

        /* حماية صارمة لأبعاد الشعار في شريط التنقل */
        .logo img {
            height: 38px !important;
            width: auto !important;
            max-height: 38px !important;
            max-width: 150px !important;
            object-fit: contain !important;
            display: block !important;
        }
        
        #menu-toggle { display: none; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
        
        #nav-menu ul {
            display: flex;
            list-style: none;
            gap: 16px;
            align-items: center;
            margin: 0;
            padding: 0;
        }
        #nav-menu ul li a { font-size: 0.9rem; white-space: nowrap; text-decoration: none; color: #ffffff !important; text-shadow: 0 2px 6px rgba(0,0,0,0.8); transition: color 0.2s; }
        #nav-menu ul li a:hover { color: #38bdf8 !important; }

        /* صندوق الملاحظة (بإطار زجاجي شفاف تماماً وناعم) */
        .service-translation-banner {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(212, 175, 55, 0.6);
            border-radius: 20px;
            padding: 18px 25px;
            max-width: 800px;
            margin: 20px auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
            direction: ltr !important;
        }
        .banner-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .banner-main-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .lang-badge.arabic {
            background: rgba(59, 130, 246, 0.85);
            color: #ffffff !important;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .divider { color: rgba(255, 255, 255, 0.7); font-weight: bold; }
        .translation-note {
            color: #38bdf8 !important;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 1rem;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }
        .banner-sub-text {
            color: #ffffff !important;
            font-size: 0.92rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 8px;
            width: 100%;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }
        .banner-sub-text i { color: #d4af37 !important; }
        .highlight-en { color: #ffd43b !important; font-weight: 700; }

        /* قسم الهيرو (بإضاءة شفافة ونصوص بارزة بالظل) */
        .hero {
            padding: 40px 20px 50px 20px;
            text-align: center;
            background: transparent !important;
        }
        .hero-content {
            max-width: 800px;
            margin: 0 auto;
        }

        /* حماية صارمة لأبعاد الشعار الكبير في الواجهة الرئيسية */
        .hero-content img {
            height: 110px !important;
            width: auto !important;
            max-height: 110px !important;
            max-width: 300px !important;
            object-fit: contain !important;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
            display: block !important;
            margin: 0 auto 15px auto;
        }

        .hero h1 { font-size: 2.8rem; margin: 10px 0; text-shadow: 0 3px 12px rgba(0,0,0,0.9); color: #ffffff !important; }
        .hero h2 { font-size: 1.6rem; margin: 0 0 15px 0; text-shadow: 0 3px 10px rgba(0,0,0,0.9); color: #ffffff !important; }
        .vision-text { font-size: 1.2rem; margin: 0 auto 25px auto; color: #ffffff !important; text-shadow: 0 3px 10px rgba(0,0,0,0.9); line-height: 1.6; }

        .hero-buttons { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .btn-main { background: #4dabf7; color: #ffffff !important; padding: 12px 28px; border-radius: 30px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        .btn-outline { background: rgba(0,0,0,0.2); border: 2px solid #ffffff; color: #ffffff !important; padding: 12px 28px; border-radius: 30px; text-decoration: none; font-weight: bold; backdrop-filter: blur(4px); box-shadow: 0 4px 15px rgba(0,0,0,0.6); }

        /* بطاقات الخدمات (بخلفية زجاجية شفافة تماماً) */
        .section { padding: 50px 20px; background: transparent !important; }
        .container { max-width: 1100px; margin: 0 auto; text-align: center; background: transparent !important; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 30px; }
        
        .service-card { 
            background: rgba(0, 0, 0, 0.35) !important; 
            backdrop-filter: blur(8px); 
            border: 1px solid rgba(255, 255, 255, 0.25); 
            padding: 30px 20px; 
            border-radius: 16px; 
            text-align: center; 
            transition: all 0.3s ease; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.4); 
            text-decoration: none !important; 
            display: block; 
        }
        .service-card:hover { transform: translateY(-5px); border-color: rgba(77, 171, 247, 0.8); background: rgba(0, 0, 0, 0.5) !important; }
        .service-card h3 { color: #ffffff !important; margin: 10px 0; font-size: 1.3rem; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
        .service-card p { color: #ffffff !important; margin: 5px 0; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
        .section h2 { text-shadow: 0 3px 10px rgba(0,0,0,0.9); }
        .section p { text-shadow: 0 2px 8px rgba(0,0,0,0.9); }

        /* نافذة الصيانة المتمركزة تماماً في المنتصف */
        #under-construction-modal { 
            display: none; 
            position: fixed !important; 
            top: 0 !important; 
            left: 0 !important; 
            width: 100vw !important; 
            height: 100vh !important; 
            background: rgba(0, 0, 0, 0.8) !important; 
            backdrop-filter: blur(10px); 
            z-index: 99999 !important; 
            justify-content: center !important; 
            align-items: center !important; 
            margin: 0 !important;
        }
        .modal-content { 
            background: rgba(20, 20, 20, 0.95); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(77, 171, 247, 0.5); 
            padding: 40px 30px; 
            border-radius: 20px; 
            text-align: center; 
            max-width: 400px; 
            width: 90%; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); 
            margin: auto !important;
        }
        .modal-btn { background: #4dabf7; color: #fff; border: none; padding: 10px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        /* الموبايل */
        @media (max-width: 1000px) {
            #menu-toggle { display: block; }
            #nav-menu { display: none; position: absolute; top: 100%; left: 0; width: 100%; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(15px); padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.15); box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
            #nav-menu.active { display: block; }
            #nav-menu ul { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <div class="en-bg-slideshow">
        <div class="en-slide"></div>
        <div class="en-slide"></div>
        <div class="en-slide"></div>
        <div class="en-slide"></div>
        <div class="en-slide"></div>
    </div>
    
    <div class="en-overlay"></div>

    <div id="under-construction-modal">
        <div class="modal-content">
            <div style="font-size: 3.5rem; color: #4dabf7; margin-bottom: 15px;"><i class="fas fa-hammer"></i></div>
            <h3 style="color: #ffffff; margin-bottom: 10px; text-shadow: 0
