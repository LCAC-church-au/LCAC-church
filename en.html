<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">          
    <title>Life Center Arabic Church - LCAC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .en-bg-slideshow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; overflow: hidden; }
        .en-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; animation: enSlideAnimation 30s infinite; }
        .en-slide:nth-child(1) { background-image: url('church4.jpg'); animation-delay: 0s; }
        .en-slide:nth-child(2) { background-image: url('church5.jpg'); animation-delay: 6s; }
        .en-slide:nth-child(3) { background-image: url('church6.jpg'); animation-delay: 12s; }
        .en-slide:nth-child(4) { background-image: url('church7.jpg'); animation-delay: 18s; }
        .en-slide:nth-child(5) { background-image: url('church8.jpg'); animation-delay: 24s; }
        @keyframes enSlideAnimation { 0% { opacity: 0; transform: scale(1); } 8% { opacity: 1; } 24% { opacity: 1; } 32% { opacity: 0; transform: scale(1.05); } 100% { opacity: 0; } }
        .en-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.45); z-index: -1; }
        .en-hero-text h2, .en-hero-text p, .hero h1, .hero h2, .vision-text { text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
        .service-card { background: rgba(15, 15, 15, 0.35) !important; backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 30px; border-radius: 14px; text-align: center; transition: all 0.3s ease; box-shadow: 0 8px 25px rgba(0,0,0,0.5); text-decoration: none !important; display: block; cursor: pointer; }
        .service-card:hover { transform: translateY(-5px); background: rgba(15, 15, 15, 0.55) !important; border-color: rgba(77, 171, 247, 0.5); }
        .service-card h3, .service-card p, .service-card span, .service-card i { text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
        #contact { background: transparent !important; width: 100%; display: flex; justify-content: center; align-items: center; }
        #contact .container { width: 100%; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        
        .qr-clean-img { max-width: 190px; border-radius: 12px; border: 3px solid rgba(255, 255, 255, 0.3); box-shadow: 0 8px 25px rgba(0,0,0,0.7); display: inline-block; padding: 8px; background: #ffffff; }

        #under-construction-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); z-index: 9999; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.4s ease; }
        .modal-content { background: linear-gradient(135deg, rgba(30, 30, 30, 0.9), rgba(15, 15, 15, 0.95)); border: 1px solid rgba(77, 171, 247, 0.4); padding: 45px 30px; border-radius: 20px; text-align: center; max-width: 420px; width: 90%; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9); transform: scale(0.7) translateY(30px); animation: modalPopIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes modalPopIn { to { transform: scale(1) translateY(0); opacity: 1; } }
        .modal-icon-glow { font-size: 3.8rem; color: #4dabf7; margin-bottom: 20px; }
        .modal-btn { background: linear-gradient(135deg, #4dabf7, #228be6); color: #fff; border: none; padding: 12px 30px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.05rem; }
        
        /* تنسيق الشريط العلوي وقائمة التنقل */
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 15px 30px;
            direction: ltr; /* لتكون القائمة الإنجليزية مرتبة من اليسار لليمين بشكل صحيح */
        }
        .logo a { display: flex; align-items: center; gap: 10px; white-space: nowrap; text-decoration: none; color: #fff; font-weight: bold; font-size: 1rem; }
        
        #menu-toggle { display: none !important; }
        #nav-menu { display: block !important; position: static !important; width: auto !important; background: transparent !important; box-shadow: none !important; }
        #nav-menu ul {
            display: flex;
            list-style: none;
            gap: 18px;
            align-items: center;
            margin: 0;
            padding: 0;
        }
        #nav-menu ul li a { font-size: 0.9rem; white-space: nowrap; }

        /* تنسيق مربع الملاحظة الكبير نسبيًا والواضح */
        .service-translation-banner {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 24px;
            padding: 22px 35px;
            max-width: 850px;
            margin: 30px auto;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
            direction: ltr !important;
        }
        .service-translation-banner:hover {
            border-color: rgba(212, 175, 55, 0.8);
            box-shadow: 0 20px 50px rgba(212, 175, 55, 0.2);
        }
        .banner-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            font-size: 1.05rem;
        }
        .banner-main-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .lang-badge.arabic {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #ffffff;
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .divider {
            color: rgba(255, 255, 255, 0.4);
            font-weight: bold;
            font-size: 1.2rem;
        }
        .translation-note {
            color: #38bdf8;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1.05rem;
        }
        .translation-note i {
            color: #38bdf8;
            font-size: 1.2rem;
        }
        .banner-sub-text {
            color: #cbd5e1;
            font-size: 0.98rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
            width: 100%;
        }
        .banner-sub-text i {
            color: #d4af37;
            font-size: 1.1rem;
        }
        .highlight-en {
            color: #ffd43b;
            font-weight: 700;
        }

        /* الشاشات الصغيرة (الموبايل) */
        @media (max-width: 1200px) {
            #menu-toggle { display: block !important; background: none; border: none; color: #fff; font-size: 1.6rem; cursor: pointer; }
            #nav-menu { display: none !important; position: absolute !important; top: 100% !important; left: 0 !important; width: 100% !important; background: rgba(15, 15, 15, 0.95) !important; backdrop-filter: blur(10px); padding: 20px 0; z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
            #nav-menu.active { display: block !important; }
            #nav-menu ul { flex-direction: column !important; gap: 15px !important; text-align: center !important; }
        }
    </style>
</head>

        <div class="en-slide"></div>

                <i class="fas fa-bars"></i>
