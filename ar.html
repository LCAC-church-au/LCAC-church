<html lang="ar" dir="rtl">
<head>

    <style>
        /* خلفية الصور المتحركة الخاصة بالموقع العربي */
        .ar-bg-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .ar-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: arSlideAnimation 30s infinite;
        }

        .ar-slide:nth-child(1) { background-image: url('church4.jpg'); animation-delay: 0s; }
        .ar-slide:nth-child(2) { background-image: url('church5.jpg'); animation-delay: 6s; }
        .ar-slide:nth-child(3) { background-image: url('church6.jpg'); animation-delay: 12s; }
        .ar-slide:nth-child(4) { background-image: url('church7.jpg'); animation-delay: 18s; }
        .ar-slide:nth-child(5) { background-image: url('church8.jpg'); animation-delay: 24s; }

        @keyframes arSlideAnimation {
            0% { opacity: 0; transform: scale(1); }
            8% { opacity: 1; }
            24% { opacity: 1; }
            32% { opacity: 0; transform: scale(1.05); }
            100% { opacity: 0; }
        }

        /* طبقة عتمة عامة خفيفة ومتوازنة لترى الصور بوضوح */
        .ar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        /* تنسيق العنوان الرئيسي بدون مربعات مع ظلال قوية */
        .ar-hero-text h2, .ar-hero-text p, .hero h1, .hero h2, .vision-text {
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        /* بطاقات الخدمات الشفافة والقابلة للنقر */
        .service-card {
            background: rgba(15, 15, 15, 0.35) !important;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 14px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            text-decoration: none !important;
            display: block;
            cursor: pointer;
        }

        .service-card:hover {
            transform: translateY(-5px);
            background: rgba(15, 15, 15, 0.55) !important;
            border-color: rgba(77, 171, 247, 0.5);
        }

        .service-card h3, .service-card p, .service-card span, .service-card i {
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }

        /* ضبط قسم التواصل والـ QR ليكون في المنتصف تماماً */
        #contact {
            background: transparent !important;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #contact .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .qr-clean-img {
            max-width: 190px;
            border-radius: 12px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            display: inline-block;
            padding: 8px;
            background: #ffffff;
        }

        /* -------------------------------------------------- */
        /* تصميم عصري ومتحرك لنافذة "تحت الإنشاء" الحديثة */
        /* -------------------------------------------------- */
        #under-construction-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(30, 30, 30, 0.9), rgba(15, 15, 15, 0.95));
            border: 1px solid rgba(77, 171, 247, 0.4);
            padding: 45px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(77, 171, 247, 0.2);
            transform: scale(0.7) translateY(30px);
            animation: modalPopIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes modalPopIn {
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        /* حركة نبض الأيقونة العصرية */
        .modal-icon-glow {
            font-size: 3.8rem;
            color: #4dabf7;
            margin-bottom: 20px;
            animation: iconPulse 2s infinite ease-in-out;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(77,171,247,0.4)); }
            50% { transform: scale(1.12); filter: drop-shadow(0 0 15px rgba(77,171,247,0.8)); }
        }

        .modal-btn {
            background: linear-gradient(135deg, #4dabf7, #228be6);
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.05rem;
            box-shadow: 0 5px 15px rgba(77, 171, 247, 0.4);
            transition: all 0.3s ease;
        }

        .modal-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(77, 171, 247, 0.6);
            background: linear-gradient(135deg, #339af0, #1c7ed6);
        }
    </style>
</head>
