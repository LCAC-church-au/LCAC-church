<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كنيسة مركز الحياة العربية - Life Center Arabic Church</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* تنسيق خاص بصفحة الاستقبال لتبقى في منتصف الشاشة وبشكل فاخر */
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .welcome-card {
            background: #161616;
            border: 1px solid #262626;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            max-width: 450px;
            width: 90%;
        }
        .welcome-logo img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 50%;
            background: #000;
            padding: 5px;
            border: 2px solid #333;
        }
        .welcome-card h1 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            color: #fff;
        }
        .welcome-card h2 {
            font-size: 1.1rem;
            color: #a3a3a3;
            margin-bottom: 30px;
            font-weight: 400;
            direction: ltr;
        }
        .lang-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .lang-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s;
        }
        .btn-ar {
            background: #2563eb;
            color: #fff;
        }
        .btn-ar:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }
        .btn-en {
            background: #262626;
            color: #fff;
            border: 1px solid #404040;
        }
        .btn-en:hover {
            background: #333333;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="welcome-logo">
            <!-- تأكد أن اسم صورة الشعار مطابق تماماً للملف المرفوع -->
            <img src="chrch Logo.png" alt="LCAC Logo">
        </div>
        
        <h1>كنيسة مركز الحياة العربية</h1>
        <h2>Life Center Arabic Church</h2>
        
        <p style="color: #888; font-size: 0.95rem; margin-bottom: 30px;">
            يرجى اختيار اللغة للتابعة إلى الموقع<br>Please choose your preferred language
        </p>

        <div class="lang-buttons">
            <!-- زر الدخول للنسخة العربية -->
            <a href="ar.html" class="lang-btn btn-ar">
                <i class="fas fa-globe-americas"></i> الدخول بالعربية
            </a>
            
            <!-- زر الدخول للنسخة الإنجليزية -->
            <a href="en.html" class="lang-btn btn-en">
                <i class="fas fa-globe"></i> English Site
            </a>
        </div>
    </div>

</body>
</html>
