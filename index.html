<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كنيسة مركز الحياة العربية - Life Center Arabic Church</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* خلفية صور الكنيسة المتحركة (Slideshow) */
        .bg-slideshow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: slideAnimation 18s infinite;
        }

        /* ضع أسماء صورك هنا (تأكد من مطابقة أسماء الملفات على GitHub) */
        .bg-slide:nth-child(1) {
            background-image: url('church1.jpg');
            animation-delay: 0s;
        }
        .bg-slide:nth-child(2) {
            background-image: url('church2.jpg');
            animation-delay: 6s;
        }
        .bg-slide:nth-child(3) {
            background-image: url('church3.jpg');
            animation-delay: 12s;
        }

        @keyframes slideAnimation {
            0% { opacity: 0; transform: scale(1); }
            10% { opacity: 1; }
            33% { opacity: 1; }
            43% { opacity: 0; transform: scale(1.05); }
            100% { opacity: 0; }
        }

        /* طبقة عتمة سوداء فوق الصور لتبقى النصوص مقروءة بوضوح تانٍ */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: -1;
        }

        .welcome-card {
            background: rgba(22, 22, 22, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            max-width: 450px;
            width: 90%;
            position: relative;
            z-index: 2;
        }

        /* الشعار مع إزالة الخلفية وتوهج خفيف */
        .welcome-logo img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border: 2px solid rgba(255,255,255,0.2);
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 10px rgba(77, 175, 247, 0.5));
            animation: floatLogo 4s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .welcome-card h1 {
            font-size: 1.6rem;
            margin-bottom: 5px;
            color: #fff;
        }
        .welcome-card h2 {
            font-size: 1rem;
            color: #a3a3a3;
            margin-bottom: 25px;
            font-weight: 400;
            direction: ltr;
        }
        .lang-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .lang-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s;
        }
        .btn-ar {
            background: #2563eb;
            color: #fff;
        }
        .btn-ar:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }
        .btn-en {
            background: #262626;
            color: #fff;
            border: 1px solid #404040;
        }
        .btn-en:hover {
            background: #333333;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- خلفية الصور المتحركة -->
    <div class="bg-slideshow">
        <div class="bg-slide"></div>
        <div class="bg-slide"></div>
        <div class="bg-slide"></div>
    </div>
    
    <!-- طبقة التعتيم والضباب -->
    <div class="overlay"></div>

    <div class="welcome-card">
        <div class="welcome-logo">
            <img src="chrch Logo.png" alt="LCAC Logo">
        </div>
        
        <h1>كنيسة مركز الحياة العربية</h1>
        <h2>Life Center Arabic Church</h2>
        
        <p style="color: #888; font-size: 0.9rem; margin-bottom: 25px;">
            يرجى اختيار اللغة للمتابعة<br>Please choose your preferred language
        </p>

        <div class="lang-buttons">
            <a href="ar.html" class="lang-btn btn-ar">
                <i class="fas fa-globe-americas"></i> الدخول بالعربية
            </a>
            
            <a href="en.html" class="lang-btn btn-en">
                <i class="fas fa-globe"></i> English Site
            </a>
        </div>
    </div>

</body>
</html>
