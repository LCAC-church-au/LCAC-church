<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة النمو - درس الكتاب | كنيسة مركز الحياة العربية LCAC</title>
    
    <!-- الأيقونات والخطوط وملف التصميم المركزي -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #05070a 0%, #0c1017 50%, #05070a 100%);
            color: #f3f4f6;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            scroll-behavior: smooth;
        }

        .bible-hero {
            text-align: center;
            padding: 140px 20px 40px;
            background: radial-gradient(circle at center, rgba(77, 171, 247, 0.12) 0%, rgba(7, 9, 14, 0.95) 75%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* زر رحلة النمو البارز في الأعلى */
        .journey-trigger-container {
            text-align: center;
            padding: 60px 20px 40px 20px;
        }

        .journey-main-btn {
            background: linear-gradient(135deg, #4dabf7, #1d4ed8);
            color: #fff;
            border: none;
            padding: 18px 40px;
            border-radius: 40px;
            font-size: 1.25rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 35px rgba(77, 171, 247, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .journey-main-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 45px rgba(77, 171, 247, 0.6);
            color: #fff;
        }

        /* قسم حاوية الأسابيع */
        .weeks-section-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 5% 80px 5%;
        }

        .section-title-box {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }

        /* شبكة الأسابيع */
        .weeks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .week-card {
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .week-card:hover {
            transform: translateY(-6px);
            border-color: #4dabf7;
            box-shadow: 0 12px 35px rgba(77, 171, 247, 0.3);
            background: rgba(30, 41, 59, 0.85);
        }

        /* أزرار المستقبل الجاهزة */
        .week-card.future-card {
            border: 2px dashed rgba(77, 171, 247, 0.3);
            background: rgba(77, 171, 247, 0.03);
            text-align: center;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }
        .week-card.future-card:hover {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
        }

        .week-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
            color: #4dabf7;
        }

        .week-date {
            background: rgba(77, 171, 247, 0.15);
            color: #4dabf7;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
        }

        .week-content h3 {
            color: #fff;
            font-size: 1.25rem;
            margin-bottom: 10px;
        }

        .week-content p {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .idea-box {
            background: rgba(255, 215, 0, 0.08);
            border: 1px dashed rgba(255, 215, 0, 0.4);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            color: #ffd43b;
            margin-bottom: 15px;
        }

        .verse-badge {
            font-style: italic;
            color: #e5e5e5;
            font-size: 0.88rem;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 12px;
            display: block;
        }

        /* تنسيق النافذة المنبثقة للتفاصيل */
        #lesson-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(14px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-box {
            background: linear-gradient(145deg, #111827, #0f172a);
            border: 1px solid rgba(77, 171, 247, 0.5);
            border-radius: 20px;
            padding: 35px;
            max-width: 580px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            transform: scale(0.85) translateY(20px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: right;
        }

        #lesson-modal.active .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-verse-highlight {
            background: rgba(77, 171, 247, 0.12);
            border-right: 4px solid #4dabf7;
            padding: 18px 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .modal-verse-highlight p {
            color: #ffd43b;
            font-size: 1.15rem;
            font-weight: bold;
            font-style: italic;
            margin: 0;
            line-height: 1.7;
        }

        .modal-close-btn {
            background: linear-gradient(135deg, #4dabf7, #1d4ed8);
            color: #fff;
            border: none;
            padding: 12px 35px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            display: block;
            margin: 25px auto 0 auto;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(77, 171, 247, 0.4);
        }
        .modal-close-btn:hover { transform: scale(1.05); }

        /* الهيدر العلوي */
        .nav-container { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; }
        header { background: rgba(15, 15, 15, 0.92); backdrop-filter: blur(10px); position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .logo a { color: #fff; text-decoration: none; font-weight: bold; font-size: 1.05rem; display: flex; align-items: center; gap: 10px; }
        #nav-menu ul { display: flex; list-style: none; gap: 20px; align-items: center; margin: 0; padding: 0; }
        #nav-menu ul li a { color: #cbd5e1; text-decoration: none; font-size: 0.95rem; transition: color 0.3s; }
        #nav-menu ul li a:hover { color: #4dabf7; }
    </style>
</head>
